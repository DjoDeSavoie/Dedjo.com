[build]
  functions = "netlify/functions"

# Node figé : l'installation neuve des dépendances (netlify-cli) échoue sous Node 18.16
[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[dev]
command = "npm run dev"
targetPort = 5173

[functions]
directory = "netlify/functions"